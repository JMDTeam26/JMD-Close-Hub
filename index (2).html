<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMD Close Hub | Monthly &amp; Quarterly Operations</title>
<style>
  :root{
    --navy:#0D1B2A; --navy-mid:#1B2D44; --navy-light:#2D4263;
    --gold:#B8922A; --gold-light:#D4AF52; --gold-pale:#F5EBC8;
    --sage:#3A6B4C; --sage-light:#5C8A6E; --sage-pale:#E0EDDF;
    --cream:#FAF7EE; --ink:#1A1A1A;
    --slate:#5A6573; --slate-light:#8E96A0;
    --border:#D9DDE3; --border-light:#E8EAEE;
    --white:#FFFFFF; --red:#9B2226; --red-light:#FCE8E8;
    --amber:#B07700; --amber-light:#FCF1D8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;font-size:13px}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit}

  /* Header */
  header{background:var(--navy);color:var(--white);padding:14px 28px;border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:transparent;border:none;color:var(--white)}
  .brand-mark{width:32px;height:32px;background:var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:14px}
  .brand-text{text-align:left}
  .brand-text .t{font-size:15px;font-weight:700;letter-spacing:.02em}
  .brand-text .s{font-size:10px;color:var(--gold-light);letter-spacing:.08em;text-transform:uppercase}
  .header-right{display:flex;align-items:center;gap:14px;font-size:12px}
  .saved{display:none;align-items:center;gap:6px;color:var(--sage-light)}
  .saved.show{display:flex;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* Buttons */
  .btn{border:none;border-radius:4px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;font-family:inherit;transition:opacity .15s}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--gold);color:var(--navy);padding:10px 20px;font-size:13px;font-weight:700}
  .btn-primary.compact{padding:7px 14px;font-size:12px}
  .btn-primary:hover:not(:disabled){background:var(--gold-light)}
  .btn-secondary{background:var(--white);color:var(--navy);border:1px solid var(--border);padding:8px 14px;font-size:12px}
  .btn-secondary:hover:not(:disabled){background:var(--cream)}
  .btn-sage{background:var(--sage);color:var(--white);padding:8px 14px;font-size:12px}
  .btn-sage:hover:not(:disabled){background:var(--sage-light)}
  .btn-danger{background:var(--white);color:var(--red);border:1px solid var(--red);padding:7px 12px;font-size:11px}
  .btn-icon{background:transparent;border:none;color:var(--slate);cursor:pointer;padding:4px;display:inline-flex;align-items:center}
  .btn-icon:hover{color:var(--navy)}
  .btn-back{background:transparent;border:none;color:var(--slate);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0;margin-bottom:12px}
  .btn-back:hover{color:var(--navy)}

  main{max-width:1400px;margin:0 auto;padding:28px 32px}

  /* Dashboard */
  .period-banner{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  .period-banner .label{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
  .period-banner h1{margin:4px 0 0;font-size:28px;color:var(--navy);font-weight:700}
  .quarter-tag{font-size:13px;color:var(--gold);font-weight:600;margin-left:12px;padding:3px 10px;background:var(--gold-pale);border-radius:4px;vertical-align:middle}
  .summary-meta{font-size:11px;color:var(--slate);text-align:right}

  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:var(--white);padding:14px 16px;border-radius:6px;border:1px solid var(--border-light)}
  .kpi.s0{border-left:4px solid var(--slate)}
  .kpi.s1{border-left:4px solid var(--gold)}
  .kpi.s2{border-left:4px solid var(--amber)}
  .kpi.s3{border-left:4px solid var(--navy-light)}
  .kpi.s4{border-left:4px solid var(--sage)}
  .kpi-label{font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .kpi-value{font-size:24px;font-weight:700;color:var(--navy);margin-top:2px}

  .alert-overdue{background:var(--red-light);border:1px solid var(--red);border-radius:6px;padding:10px 14px;margin-bottom:18px;display:none;align-items:center;gap:10px;font-size:13px}
  .alert-overdue.show{display:flex}
  .alert-overdue .strong{color:var(--red);font-weight:600}
  .alert-overdue .meta{color:var(--slate)}

  .filter-bar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  .filter-bar .filter-label{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .filter-group{display:flex;align-items:center;gap:6px}
  .filter-group .lbl{font-size:11px;color:var(--slate)}
  .clear-filter{background:transparent;border:none;color:var(--gold);font-size:11px;cursor:pointer;text-decoration:underline}

  select,input[type=text],textarea{padding:8px 11px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--white);color:var(--ink)}
  select{cursor:pointer;padding:7px 10px;color:var(--navy)}
  select:disabled,input:disabled,textarea:disabled{opacity:.6;cursor:not-allowed;background:var(--cream)}

  .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .client-card{background:var(--white);border-radius:6px;border:1px solid var(--border-light);padding:16px;position:relative;cursor:pointer;transition:box-shadow .15s;overflow:hidden}
  .client-card:hover{box-shadow:0 4px 12px rgba(13,27,42,.08)}
  .urgency-stripe{position:absolute;top:0;left:0;right:0;height:3px}
  .hold-badge{position:absolute;top:10px;right:10px;background:var(--red-light);color:var(--red);font-size:9px;padding:2px 7px;border-radius:3px;font-weight:700;letter-spacing:.08em}
  .client-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;padding-top:4px}
  .client-code{font-size:11px;color:var(--slate);font-weight:600}
  .client-name{font-size:16px;font-weight:700;color:var(--navy);margin-top:1px}
  .badge-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:9px;padding:3px 7px;border-radius:3px;font-weight:700;letter-spacing:.05em}
  .b-tier-1{background:var(--navy);color:var(--white)}
  .b-tier-2{background:var(--gold);color:var(--white)}
  .b-tier-3{background:var(--sage);color:var(--white)}
  .b-tier-4{background:var(--slate-light);color:var(--white)}
  .b-tier-p{background:var(--navy-mid);color:var(--white)}
  .b-pf{background:var(--sage-pale);color:var(--sage)}
  .b-basis{background:var(--border-light);color:var(--slate);font-weight:600}
  .status-pill{border-radius:4px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .status-dot{width:8px;height:8px;border-radius:50%}
  .status-text{font-size:12px;font-weight:700}
  .days-marker{font-size:10px;font-weight:600}
  .card-footer{display:flex;justify-content:space-between;font-size:11px;color:var(--slate);padding-top:8px;border-top:1px solid var(--border-light)}
  .empty-state{padding:40px;text-align:center;color:var(--slate);font-size:13px;background:var(--white);border-radius:6px;border:1px dashed var(--border);grid-column:1/-1}

  /* Status colors */
  .st-NotStarted{background:#EDEFF3;color:var(--slate)} .st-NotStarted .status-dot{background:var(--slate-light)}
  .st-InProgress{background:var(--gold-pale);color:var(--amber)} .st-InProgress .status-dot{background:var(--gold)}
  .st-AwaitingClient{background:var(--amber-light);color:var(--amber)} .st-AwaitingClient .status-dot{background:var(--amber)}
  .st-InReview{background:#E5EEF5;color:var(--navy-mid)} .st-InReview .status-dot{background:var(--navy-light)}
  .st-Complete{background:var(--sage-pale);color:var(--sage)} .st-Complete .status-dot{background:var(--sage)}
  .st-NA{background:#F5F5F5;color:#9aa1ad;opacity:0.85} .st-NA .status-dot{background:#c0c5cd}

  /* Workspace */
  .workspace-card{background:var(--white);border-radius:8px;border:1px solid var(--border-light);margin-bottom:16px;overflow:hidden}
  .ws-header{background:var(--navy);color:var(--white);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .ws-meta-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
  .ws-meta-code{font-size:11px;color:var(--gold-light);font-weight:600;letter-spacing:.08em}
  .ws-header h2{font-size:22px;font-weight:700}
  .ws-meta-sub{font-size:11px;color:var(--gold-light);margin-top:4px}
  .ws-edit-btn{background:var(--navy-light);color:var(--white);border:1px solid var(--navy-light);padding:7px 12px;border-radius:4px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .ws-edit-btn:hover{background:var(--navy-mid)}

  .ws-tabs{display:flex;border-bottom:1px solid var(--border-light);background:var(--cream);overflow-x:auto}
  .ws-tab{flex:1;min-width:160px;padding:12px 16px;background:transparent;border:none;border-bottom:3px solid transparent;color:var(--slate);font-weight:500;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
  .ws-tab.active{background:var(--white);border-bottom-color:var(--gold);color:var(--navy);font-weight:700}
  .ws-tab:hover:not(.active){color:var(--navy-mid)}
  .ws-tab.disabled{opacity:.4;cursor:not-allowed}

  .ws-period-bar{padding:14px 22px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .period-control{display:flex;align-items:center;gap:10px}
  .period-control-label{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

  .ws-body{padding:22px}
  .section-label{margin-bottom:10px}
  .section-label .row{display:flex;align-items:center;gap:8px}
  .section-label .num{width:22px;height:22px;background:var(--navy);color:var(--white);border-radius:4px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .section-label .text{font-size:13px;font-weight:700;color:var(--navy)}
  .section-label .sub{font-size:11px;color:var(--slate);margin-top:4px;margin-left:30px}
  .field-label{display:block;font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
  .check-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--navy);cursor:pointer}
  .check-row{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap}
  textarea{min-height:70px;resize:vertical;width:100%}
  input[type=text]{width:100%}

  .info-box{padding:10px 14px;border-radius:4px;margin-bottom:18px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
  .info-box.gold{background:var(--gold-pale);border:1px solid var(--gold);color:var(--amber)}
  .info-box.sage{background:var(--sage-pale);border:1px solid var(--sage);color:var(--sage)}
  .info-box.navy{background:#E5EEF5;border:1px solid var(--navy-light);color:var(--navy-mid)}
  .info-box .strong{display:block;margin-bottom:4px;font-weight:700}

  .deliverable-box{margin-top:18px;padding:14px;background:var(--cream);border-radius:4px;font-size:11px;color:var(--slate);border:1px solid var(--border-light)}
  .deliverable-box .strong{color:var(--navy);display:block;margin-bottom:6px;font-weight:700}
  .deliverable-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;line-height:1.5}

  .oi-table{background:var(--white);border:1px solid var(--border-light);border-radius:4px;overflow:hidden}
  .oi-row{display:grid;grid-template-columns:1fr 130px 110px 36px;gap:8px;padding:8px 12px;align-items:center}
  .oi-row.head{background:var(--cream);font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;font-weight:700;border-bottom:1px solid var(--border-light);padding:8px 12px}
  .oi-row:not(.head){border-bottom:1px solid var(--border-light)}
  .oi-row:not(.head):last-child{border-bottom:none}
  .oi-row input,.oi-row select{padding:6px 9px;font-size:12px}
  .oi-empty{padding:16px;text-align:center;color:var(--slate);font-size:12px}
  .oi-add{background:transparent;color:var(--gold);border:1px dashed var(--gold);padding:6px 12px;border-radius:4px;font-size:11px;margin-top:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .oi-rm{background:transparent;border:none;color:var(--red);cursor:pointer;padding:4px;display:inline-flex;align-items:center}
  .pri-URGENT{background:var(--red)!important;color:var(--white)!important;font-weight:700}
  .pri-HIGH{background:#D97706!important;color:var(--white)!important;font-weight:700}
  .pri-MEDIUM{background:var(--gold)!important;color:var(--white)!important;font-weight:700}
  .pri-LOW{background:var(--slate-light)!important;color:var(--white)!important;font-weight:700}

  .action-bar{margin-top:22px;padding-top:18px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .action-bar .left-group{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .lock-marker{color:var(--sage);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}

  .context-preview{background:var(--white);border-radius:6px;border:1px solid var(--border-light);padding:16px}
  .context-preview .title{font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:6px}
  .context-preview .body{font-size:12px;color:var(--slate);line-height:1.6;max-height:120px;overflow:auto;white-space:pre-wrap}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(13,27,42,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:100;overflow-y:auto}
  .modal-overlay.show{display:flex}
  .modal{background:var(--white);border-radius:8px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;max-width:600px}
  .modal.lg{max-width:700px}
  .modal.xl{max-width:1000px}
  .modal-header{background:var(--navy);color:var(--white);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gold)}
  .modal-header h3{font-size:15px;font-weight:700}
  .modal-close{background:transparent;border:none;color:var(--white);cursor:pointer;padding:4px;display:inline-flex}
  .modal-body{padding:22px;max-height:80vh;overflow-y:auto}

  /* Prompt output */
  .prompt-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .prompt-bar-meta{font-size:12px;color:var(--slate);flex:1;min-width:200px}
  .prompt-output{background:var(--navy);color:#E8E8E8;border-radius:4px;padding:16px;font-family:Consolas,Monaco,monospace;font-size:11.5px;line-height:1.6;max-height:380px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .file-list{margin-top:16px}
  .file-list-title{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:8px}
  .file-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--cream);border-radius:4px;font-size:12px;margin-bottom:6px}
  .file-num{width:22px;height:22px;background:var(--navy);color:var(--white);border-radius:3px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .file-name{flex:1;color:var(--ink)}
  .file-type{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:700;letter-spacing:.05em;color:var(--white)}
  .ft-xlsx{background:var(--sage)}
  .ft-docx{background:var(--navy-mid)}
  .ft-proj{background:var(--gold)}

  .loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--navy);font-size:14px;gap:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin 1s linear infinite;display:inline-block}

  /* Inline icons (SVG-free, use unicode) */
  .icon{display:inline-block;line-height:1}
</style>
</head>
<body>

<header>
  <button class="brand" onclick="goDashboard()">
    <div class="brand-mark">JMD</div>
    <div class="brand-text">
      <div class="t">Close Hub</div>
      <div class="s">Monthly &amp; Quarterly Operations</div>
    </div>
  </button>
  <div class="header-right">
    <span id="savedFlash" class="saved">✓ Saved</span>
    <button id="addClientBtn" class="btn btn-primary compact" onclick="openClientEditor(null,true)">+ Add Client</button>
  </div>
</header>

<main id="root">
  <div class="loading-screen"><span class="spin">⟳</span> Loading JMD Close Hub...</div>
</main>

<!-- Modal container -->
<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modalBox" class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

  {id:'arron',code:'ALC',name:'Arron Leadership Coaching',tier:3,assigned:'Justine',entity:'S-Corporation',basis:'Cash',classes:'',isPF:false,isPersonal:false,notes:"Executive coaching and leadership advisory practice. Owner: Laurie Arron (Laurie Benezra Arron). S-Corp payroll via Gusto: ~$12,333/mo W-2 wages + $3,100/mo health insurance added to W-2 per IRS rules. Do not flag payroll structure or health insurance JEs. Monthly JEs for home office ($1,000) and Acura lease ($484.97) posted as LA-Contributions - standard recurring entries. Shellpoint mortgage (~$9,994/mo) coded as owner distribution.",defaultOI:[]},

function lastDayOfMonth(year,monthName){const m=MONTHS.indexOf(monthName);return new Date(year,m+1,0).getDate()}
function prevMonth(monthName,year){const i=MONTHS.indexOf(monthName);if(i===0)return{m:'December',y:year-1};return{m:MONTHS[i-1],y:year}}
function quarterFromMonth(monthName){return Math.floor(MONTHS.indexOf(monthName)/3)+1}
function monthsInQuarter(q){return[MONTHS[(q-1)*3],MONTHS[(q-1)*3+1],MONTHS[(q-1)*3+2]]}
function prevQuarter(q,y){if(q===1)return{q:4,y:y-1};return{q:q-1,y:y}}
function getCurrentClosePeriod(){const now=new Date();let m=now.getMonth()-1,y=now.getFullYear();if(m<0){m=11;y-=1}return{month:MONTHS[m],year:y}}
function daysSinceMonthEnd(monthName,year){const m=MONTHS.indexOf(monthName);const end=new Date(year,m+1,0);const today=new Date();return Math.floor((today-end)/86400000)}
function urgencyColor(days,status){if(status==='N/A')return'#9aa1ad';if(status==='Complete')return'#3A6B4C';if(days<0)return'#5A6573';if(days<=10)return'#3A6B4C';if(days<=20)return'#B07700';return'#9B2226'}
function periodKey(closeType,period){if(closeType==='qclose'||closeType==='qcfo'||closeType==='pfqr')return`${period.year}-Q${period.quarter}`;return`${period.year}-${String(MONTHS.indexOf(period.month)+1).padStart(2,'0')}`}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}

function getCloseRecord(clientId,type,key){return state.closes[`${type}|${clientId}|${key}`]||null}
function getLatestClose(clientId){
  const keys=Object.keys(state.closes).filter(k=>k.includes(`|${clientId}|`));
  if(!keys.length)return null;
  keys.sort((a,b)=>b.localeCompare(a));
  return state.closes[keys[0]];
}

function loadAllCloses(){
  const closes={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith(STORAGE_KEYS.CLOSE_PREFIX)){
      try{
        const stripped=k.substring(STORAGE_KEYS.CLOSE_PREFIX.length);
        closes[stripped]=JSON.parse(localStorage.getItem(k));
      }catch(e){}
    }
  }
  return closes;
}

DELIVERABLE 2: MEETING OUTLINE (INTERNAL PREP)

NUMBERED AGENDA WITH TIME BLOCKS

Structure (single page, fits on one US Letter page with 1-inch margins):

HEADER

- Optional: invitation to discuss further at the upcoming meeting

FORMATTING:
- Navy header bar with client name and quarter
- Gold accent line under section labels
- Clean prose, scannable bullets
- No tables (this is a highlights doc, not a report)
- No detailed financials, no variance %, no jargon
- Plain English
- No em dashes, en dashes, or hyphens as dashes

====================================================================
OPEN ITEMS FOR THIS QUARTER
====================================================================

${oiBlock}
${notesBlock}
====================================================================
CLIENT CONTEXT
====================================================================

${client.notes||'See attached Client Profile for full context.'}

WORKFLOW AFTER GENERATION

3. Post Drive links in the ClickUp task comment thread

function buildCFOReviewFiles(client,period){
  const{quarter,year}=period;const months=monthsInQuarter(quarter);
  const ld=lastDayOfMonth(year,months[2]);const qLabel=`Q${quarter} ${year}`;
  const prev=prevQuarter(quarter,year);const prevLabel=`Q${prev.q} ${prev.y}`;
  return[
    {name:`${client.name}_${qLabel.replace(' ','_')}_Internal_Audit_Workbook.xlsx`,type:'xlsx'},
    {name:`${client.name}_${qLabel.replace(' ','_')}_Cash_Flow_Statement.xlsx`,type:'xlsx'},
    {name:`${client.name}_Owner_Equity_Tracker_through_${qLabel.replace(' ','_')}.xlsx`,type:'xlsx'},
    {name:`${client.name}_${qLabel.replace(' ','_')}_Transaction_List_by_Vendor.xlsx`,type:'xlsx'},
    {name:`P&L Detail - ${qLabel} (by month, cash).xlsx`,type:'xlsx'},
    {name:`P&L Comparison - ${qLabel} vs ${prevLabel}.xlsx`,type:'xlsx'},
    {name:`Balance Sheet Detail - ${months[2]} ${ld}, ${year}.xlsx`,type:'xlsx'},
    {name:`${client.name}_${prevLabel.replace(' ','_')}_CFO_Report.docx`,type:'docx'},
    {name:`${client.name}_Client_Profile.docx`,type:'docx'},
    {name:`JMD_Deliverable_Standards_Guide.docx`,type:'proj'}
  ];
}

function render(){
  const root=document.getElementById('root');
  if(state.view==='dashboard'){
    document.getElementById('addClientBtn').style.display='inline-flex';
    root.innerHTML=renderDashboard();
  }else if(state.view==='workspace'){
    document.getElementById('addClientBtn').style.display='none';
    root.innerHTML=renderWorkspace();
    bindWorkspaceEvents();
  }
}

function renderDashboard(){
  const period=getCurrentClosePeriod();
  const visibleClients=state.clients.filter(c=>{
    if(state.filter.team!=='All'&&c.assigned!==state.filter.team)return false;
    if(state.filter.tier!=='All'&&String(c.tier)!==state.filter.tier)return false;
    if(state.filter.status!=='All'){
      const latest=getLatestClose(c.id);const status=latest?.status||'Not Started';
      if(status!==state.filter.status)return false;
    }
    return true;
  });

  const counts={'Not Started':0,'In Progress':0,'Awaiting Client':0,'In Review':0,'Complete':0,'N/A':0};
  let overdue=0;
  state.clients.forEach(c=>{
    if(c.isOnHold)return;
    const latest=getLatestClose(c.id);const status=latest?.status||'Not Started';
    if(counts.hasOwnProperty(status))counts[status]++;
    if(status!=='Complete'&&status!=='N/A'){
      const days=daysSinceMonthEnd(period.month,period.year);
      if(days>20)overdue++;
    }
  });

  return `
    <div class="period-banner">
      <div>
        <div class="label">Active Close Period</div>
        <h1>${period.month} ${period.year}<span class="quarter-tag">Q${quarterFromMonth(period.month)} ${period.year}</span></h1>
      </div>
      <div class="summary-meta">${visibleClients.length} of ${state.clients.filter(c=>!c.isOnHold).length} active clients shown</div>
    </div>

    <div class="kpi-strip">
      <div class="kpi s0"><div class="kpi-label">Not Started</div><div class="kpi-value">${counts['Not Started']}</div></div>
      <div class="kpi s1"><div class="kpi-label">In Progress</div><div class="kpi-value">${counts['In Progress']}</div></div>
      <div class="kpi s2"><div class="kpi-label">Awaiting Client</div><div class="kpi-value">${counts['Awaiting Client']}</div></div>
      <div class="kpi s3"><div class="kpi-label">In Review</div><div class="kpi-value">${counts['In Review']}</div></div>
      <div class="kpi s4"><div class="kpi-label">Complete</div><div class="kpi-value">${counts['Complete']}</div></div>
      <div class="kpi" style="background:#F5F5F5;color:#9aa1ad"><div class="kpi-label">N/A</div><div class="kpi-value">${counts['N/A']}</div></div>
    </div>

    <div class="alert-overdue ${overdue>0?'show':''}">
      <span style="font-size:16px">⚠</span>
      <span class="strong">${overdue} ${overdue===1?'close is':'closes are'} overdue</span>
      <span class="meta">(more than 20 days past period end)</span>
    </div>

    <div class="filter-bar">
      <span class="filter-label">Filter:</span>
      ${filterDropdown('Team','team',['All',...TEAM_MEMBERS])}
      ${filterDropdown('Tier','tier',['All','1','2','3','4','P'])}
      ${filterDropdown('Status','status',['All',...STATUS_OPTIONS])}
      ${(state.filter.team!=='All'||state.filter.tier!=='All'||state.filter.status!=='All')?`<button class="clear-filter" onclick="clearFilters()">Clear</button>`:''}
    </div>

    <div class="client-grid">
      ${visibleClients.map(c=>renderClientCard(c,period)).join('')}
      ${visibleClients.length===0?`<div class="empty-state">No clients match your filter.</div>`:''}
    </div>
  `;
}

function filterDropdown(label,key,options){
  return `<div class="filter-group"><span class="lbl">${label}:</span><select onchange="setFilter('${key}',this.value)">${options.map(o=>`<option value="${o}"${state.filter[key]===o?' selected':''}>${o==='P'&&label==='Tier'?'Personal':o}</option>`).join('')}</select></div>`;
}

function renderClientCard(c,period){
  const latest=getLatestClose(c.id);
  const status=latest?.status||'Not Started';
  const days=daysSinceMonthEnd(period.month,period.year);
  const urgent=urgencyColor(days,status);
  const oiCount=(latest?.openItems||c.defaultOI||[]).length;
  const tierKey=c.tier;
  const statusKey=STATUS_KEY[status];

  return `
    <div class="client-card" onclick="openClient('${c.id}')">
      <div class="urgency-stripe" style="background:${urgent}"></div>
      ${c.isOnHold?`<div class="hold-badge">ON HOLD</div>`:''}
      <div class="client-card-head">
        <div>
          <div class="client-code">${escapeHtml(c.code)}</div>
          <div class="client-name">${escapeHtml(c.name)}</div>
        </div>
        <button class="btn-icon" onclick="event.stopPropagation();openClientEditor('${c.id}',false)">✎</button>
      </div>
      <div class="badge-row">
        <span class="badge b-tier-${tierKey}">${TIER_LABEL[tierKey]||'Tier '+tierKey}</span>
        ${c.isPF?`<span class="badge b-pf">PF</span>`:''}
        <span class="badge b-basis">${escapeHtml(c.basis)}</span>
      </div>
      <div class="status-pill st-${statusKey}">
        <div style="display:flex;align-items:center;gap:8px"><div class="status-dot"></div><span class="status-text">${status}</span></div>
        ${!c.isOnHold?`<span class="days-marker" style="color:${urgent}">${days>=0?'+'+days+'d':days+'d'}</span>`:''}
      </div>
      <div class="card-footer">
        <span>${escapeHtml(c.assigned)}</span>
        <span>${oiCount} open item${oiCount===1?'':'s'}</span>
      </div>
    </div>
  `;
}

function renderWorkspace(){
  const client=state.clients.find(c=>c.id===state.activeClientId);
  if(!client)return'<div class="empty-state">Client not found</div>';

  const closeType=state.activeCloseType;
  const isQuarterly=closeType==='qclose'||closeType==='qcfo'||closeType==='pfqr';
  const period=isQuarterly?state.activeQuarter:state.activePeriod;
  const pKey=periodKey(closeType,period);
  const record=getCloseRecord(client.id,closeType,pKey);

  // Pull forward defaults
  let defaults={basis:client.basis||'Cash',priorRevenue:'',priorNI:'',monthNotes:'',openItems:[],isYearEnd:false,status:'Not Started'};
  if(record){
    defaults={
      basis:record.basis||defaults.basis,
      priorRevenue:record.priorRevenue||'',
      priorNI:record.priorNI||'',
      monthNotes:record.notes||'',
      openItems:record.openItems||[],
      isYearEnd:record.isYearEnd||false,
      status:record.status||'Not Started'
    };
  }else{
    // Auto-pull from prior period
    let priorKey;
    if(closeType==='qclose'||closeType==='qcfo'||closeType==='pfqr'){
      const pq=prevQuarter(period.quarter,period.year);
      priorKey=`${pq.y}-Q${pq.q}`;
    }else{
      const p=prevMonth(period.month,period.year);
      priorKey=`${p.y}-${String(MONTHS.indexOf(p.m)+1).padStart(2,'0')}`;
    }
    const priorRecord=getCloseRecord(client.id,closeType,priorKey);
    if(closeType==='monthly'){
      if(priorRecord?.keyFigures){
        defaults.priorRevenue=priorRecord.keyFigures.revenue||'';
        defaults.priorNI=priorRecord.keyFigures.netIncome||'';
      }
      const m=MONTHS.indexOf(period.month);
      defaults.isYearEnd=(m===11);
    }
    defaults.openItems=priorRecord?.openItems?.filter(oi=>oi.status!=='RESOLVED')||client.defaultOI||[];
  }

  const tierKey=client.tier;
  const statusKey=STATUS_KEY[defaults.status];
  const isLocked=defaults.status==='Complete'||defaults.status==='N/A';
  const isNA=defaults.status==='N/A';
  const isComplete=defaults.status==='Complete';

  // Stash on window for the form bindings
  window._wsState={...defaults,closeType,clientId:client.id,pKey,isLocked};

  return `
    <button class="btn-back" onclick="goDashboard()">‹ Back to Dashboard</button>

    <div class="workspace-card">
      <div class="ws-header">
        <div>
          <div class="ws-meta-row">
            <span class="ws-meta-code">${escapeHtml(client.code)}</span>
            <span class="badge b-tier-${tierKey}" style="border:1px solid var(--gold)">${TIER_LABEL[tierKey]||'Tier '+tierKey}</span>
            ${client.isPF?`<span class="badge" style="background:var(--sage);color:var(--white)">PROFIT FIRST</span>`:''}
            ${client.isPersonal?`<span class="badge" style="background:var(--gold);color:var(--navy)">PERSONAL CFO</span>`:''}
          </div>
          <h2>${escapeHtml(client.name)}</h2>
          <div class="ws-meta-sub">${escapeHtml(client.entity||'')} | Basis: ${escapeHtml(client.basis||'')} | Assigned: ${escapeHtml(client.assigned||'')}</div>
        </div>
        <button class="ws-edit-btn" onclick="openClientEditor('${client.id}',false)">✎ Edit Profile</button>
      </div>

      <div class="ws-tabs">
        ${CLOSE_TYPES.map(t=>{
          return `<button class="ws-tab ${closeType===t.id?'active':''}" onclick="setCloseType('${t.id}')">${t.icon} ${t.label}</button>`;
        }).join('')}
      </div>

      <div class="ws-period-bar">
        ${isQuarterly?`
          <div class="period-control">
            <span class="period-control-label">Quarter:</span>
            <select onchange="setQuarter(this.value)">
              <option value="1"${period.quarter===1?' selected':''}>Q1 (Jan-Mar)</option>
              <option value="2"${period.quarter===2?' selected':''}>Q2 (Apr-Jun)</option>
              <option value="3"${period.quarter===3?' selected':''}>Q3 (Jul-Sep)</option>
              <option value="4"${period.quarter===4?' selected':''}>Q4 (Oct-Dec)</option>
            </select>
            <select onchange="setQuarterYear(this.value)">
              ${[2024,2025,2026,2027].map(y=>`<option value="${y}"${period.year===y?' selected':''}>${y}</option>`).join('')}
            </select>
          </div>
        `:`
          <div class="period-control">
            <span class="period-control-label">Period:</span>
            <select onchange="setMonth(this.value)">
              ${MONTHS.map(m=>`<option value="${m}"${period.month===m?' selected':''}>${m}</option>`).join('')}
            </select>
            <select onchange="setYear(this.value)">
              ${[2024,2025,2026,2027].map(y=>`<option value="${y}"${period.year===y?' selected':''}>${y}</option>`).join('')}
            </select>
          </div>
        `}
        <div class="period-control">
          <span class="period-control-label">Status:</span>
          <select id="statusSelect" onchange="updateStatus(this.value)" ${isComplete?'disabled':''} class="st-${statusKey}" style="font-weight:700">
            ${STATUS_OPTIONS.map(s=>`<option value="${s}"${defaults.status===s?' selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="ws-body">
        ${renderFormBody(closeType,client,defaults,period)}

        <div class="action-bar">
          <div class="left-group">
            <button class="btn btn-secondary" onclick="saveCurrentForm()" ${isLocked?'disabled':''}>💾 Save</button>
            ${isComplete?`<span class="lock-marker">🔒 Period locked</span>`:isNA?`<span class="lock-marker" style="background:#F5F5F5;color:#9aa1ad">⊘ Marked N/A</span>`:`<button class="btn btn-sage" onclick="markComplete()">✓ Mark Complete</button>`}
          </div>
          ${isNA?'<span class="meta" style="color:#9aa1ad;align-self:center">No prompt needed (N/A)</span>':`<button class="btn btn-primary" onclick="generatePrompt()">📄 Generate Handoff Prompt</button>`}
        </div>
      </div>
    </div>

    <div class="context-preview">
      <div class="title">Client Context (included in every prompt)</div>
      <div class="body">${escapeHtml(client.notes||'No client notes saved.')}</div>
    </div>
  `;
}

function renderFormBody(closeType,client,d,period){
  if(closeType==='monthly'){
    return renderMonthlyForm(closeType,client,d,period);
  }else if(closeType==='qclose'){
    return renderQEndCloseForm(client,d,period);
  }else if(closeType==='qcfo'){
    return renderCFOReviewForm(client,d,period);
  }else if(closeType==='pfqr'){
    return renderPFQRForm(client,d,period);
  }
}

function renderQEndCloseForm(client,d,period){
  const months=monthsInQuarter(period.quarter);

  // Check that all three monthly closes for the quarter are complete
  const monthlyStatuses=months.map(m=>{
    const mIdx=MONTHS.indexOf(m);
    const key=`${period.year}-${String(mIdx+1).padStart(2,'0')}`;
    const rec=getCloseRecord(client.id,'monthly',key);
    return{month:m,status:rec?.status||'Not Started'};
  });
  const allComplete=monthlyStatuses.every(ms=>ms.status==='Complete');
  const prereqWarning=allComplete?'':`
    <div class="info-box gold">
      <span>⚠</span>
      <div>
        <span class="strong">Prerequisite check: monthly closes not all Complete</span>
        ${monthlyStatuses.map(ms=>`${ms.month}: ${ms.status}`).join(' | ')}<br>
        Quarter-End Close should run AFTER all three monthly closes are finalized and the Hub status is "Complete" for each.
      </div>
    </div>`;

  return `
    ${prereqWarning}
    <div class="info-box sage">
      <span>🔍</span>
      <div>
        <span class="strong">Quarter-End Close - Bookkeeper Execution</span>
        Combined internal audit workbook + quarter-end deliverables (Cash Flow Statement, Owner Equity Tracker, Vendor List). Bookkeeper iterates corrections in QBO until findings are clean, then hands deliverables to Jenni for review. Nothing in this output is shared with the client.
      </div>
    </div>

    ${sectionLabel('1','Open Items From Monthly Closes','Carried forward from the three monthly closes in this quarter. Edit or remove as needed.')}
    ${renderOITable(d.openItems,d.isLocked)}

    <div style="margin-top:18px">
      ${sectionLabel('2','Quarter Notes (optional)')}
      <textarea id="f_notes" placeholder="Special considerations for this quarter-end close" oninput="updateField('monthNotes',this.value)" ${d.isLocked?'disabled':''}>${escapeHtml(d.monthNotes)}</textarea>
    </div>

    <div class="deliverable-box">
      <span class="strong">What this prompt produces:</span>
      <div style="line-height:1.6;margin-top:6px">
        <div><b>Internal Audit Workbook</b> (.xlsx) - 8 tabs: Audit Summary, P&amp;L Flags, BS Flags, Owner Distributions, 1099 Tracker, Recurring Expenses, Expense Audit, Dependent Tasks</div>
        <div><b>Cash Flow Statement</b> (.xlsx) - quarter, cash basis</div>
        <div><b>Owner Equity Tracker</b> (.xlsx) - updated through quarter-end</div>
        <div><b>Transaction List by Vendor</b> (.xlsx) - quarter</div>
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid #d0d0d0">
        Save all 4 files to Drive: <code>/Clients/${client.name}/Quarterly Reports/${period.year} Q${period.quarter}/</code>, post links in ClickUp, set Hub status to "In Review" for Jenni.
      </div>
    </div>
  `;
}

        <div>3. <b>Client Quarterly Summary</b> (.docx) - 1 page, polished, client-facing highlights</div>
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid #d0d0d0">
        Save all 3 files to Drive: <code>/Clients/${client.name}/Quarterly Reports/${period.year} Q${period.quarter}/</code>, post links in ClickUp, set Hub status to "Complete" once all 3 are saved.
      </div>
    </div>
  `;
}

function renderOITable(items,isLocked){
  return `
    <div class="oi-table">
      <div class="oi-row head"><span>Description</span><span>Amount</span><span>Priority</span><span></span></div>
      <div id="oiList">
        ${items.length===0?'<div class="oi-empty">No open items. Click below to add.</div>':items.map((it,i)=>oiRowHtml(it,i,isLocked)).join('')}
      </div>
    </div>
    ${!isLocked?`<button class="oi-add" onclick="addOI()">+ Add open item</button>`:''}
  `;
}

function oiRowHtml(it,i,isLocked){
  return `<div class="oi-row" data-idx="${i}">
    <input type="text" value="${escapeHtml(it.desc||'')}" placeholder="Description" onchange="updateOI(${i},'desc',this.value)" ${isLocked?'disabled':''}>
    <input type="text" value="${escapeHtml(it.amt||'')}" placeholder="$0.00" onchange="updateOI(${i},'amt',this.value)" ${isLocked?'disabled':''}>
    <select class="pri-${it.pri||'MEDIUM'}" onchange="updateOI(${i},'pri',this.value);this.className='pri-'+this.value" ${isLocked?'disabled':''}>
      ${PRIORITY_OPTIONS.map(p=>`<option value="${p}"${(it.pri||'MEDIUM')===p?' selected':''}>${p}</option>`).join('')}
    </select>
    <button class="oi-rm" onclick="removeOI(${i})" ${isLocked?'disabled':''}>✕</button>
  </div>`;
}

function sectionLabel(n,text,sub){
  return `<div class="section-label">
    <div class="row">${n?`<span class="num">${n}</span>`:''}<span class="text">${text}</span></div>
    ${sub?`<div class="sub">${sub}</div>`:''}
  </div>`;
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function bindWorkspaceEvents(){/* form already bound via inline */}

function setFilter(key,val){state.filter[key]=val;render()}
function clearFilters(){state.filter={team:'All',tier:'All',status:'All'};render()}

function openClient(id){
  state.activeClientId=id;
  state.activeCloseType='monthly';
  state.activePeriod=getCurrentClosePeriod();
  state.activeQuarter={quarter:quarterFromMonth(state.activePeriod.month),year:state.activePeriod.year};
  state.view='workspace';
  render();
}
function goDashboard(){state.view='dashboard';state.activeClientId=null;render()}

function setCloseType(t){
  saveCurrentForm(true);
  state.activeCloseType=t;
  render();
}
function setMonth(m){saveCurrentForm(true);state.activePeriod={...state.activePeriod,month:m};render()}
function setYear(y){saveCurrentForm(true);state.activePeriod={...state.activePeriod,year:Number(y)};render()}
function setQuarter(q){saveCurrentForm(true);state.activeQuarter={...state.activeQuarter,quarter:Number(q)};render()}
function setQuarterYear(y){saveCurrentForm(true);state.activeQuarter={...state.activeQuarter,year:Number(y)};render()}

function updateField(key,val){window._wsState[key]=val}
function updateOI(idx,key,val){window._wsState.openItems[idx][key]=val}
function addOI(){
  window._wsState.openItems.push({desc:'',amt:'',pri:'MEDIUM'});
  document.getElementById('oiList').innerHTML=window._wsState.openItems.map((it,i)=>oiRowHtml(it,i,window._wsState.isLocked)).join('');
}
function removeOI(idx){
  window._wsState.openItems.splice(idx,1);
  if(window._wsState.openItems.length===0){
    document.getElementById('oiList').innerHTML='<div class="oi-empty">No open items. Click below to add.</div>';
  }else{
    document.getElementById('oiList').innerHTML=window._wsState.openItems.map((it,i)=>oiRowHtml(it,i,window._wsState.isLocked)).join('');
  }
}

function saveCurrentForm(silent){
  const ws=window._wsState;if(!ws)return;
  const data={
    basis:ws.basis,priorRevenue:ws.priorRevenue,priorNI:ws.priorNI,
    notes:ws.monthNotes,openItems:ws.openItems,
    isYearEnd:ws.isYearEnd,status:ws.status,
    lastUpdated:new Date().toISOString()
  };
  saveCloseRecord(ws.closeType,ws.clientId,ws.pKey,data);
  if(!silent)flashSaved();
}

function updateStatus(newStatus){
  window._wsState.status=newStatus;
  if(newStatus==='Complete'||newStatus==='N/A'){
    window._wsState.isLocked=true;
  }else{
    window._wsState.isLocked=false;
  }
  saveCurrentForm();
  render();
}

function markComplete(){
  if(!confirm('Mark this close complete? This locks the period for editing. You can still view the record.'))return;
  updateStatus('Complete');
}

function generatePrompt(){
  const ws=window._wsState;const client=state.clients.find(c=>c.id===ws.clientId);
  let prompt,files,title;
  if(ws.closeType==='qclose'){
    prompt=generateQEndClosePrompt(client,state.activeQuarter,{openItems:ws.openItems,notes:ws.monthNotes});
    files=buildQEndCloseFiles(client,state.activeQuarter);
    title=`${client.name} - Q${state.activeQuarter.quarter} ${state.activeQuarter.year} Quarter-End Close`;
  }else if(ws.closeType==='qcfo'){
    prompt=generateCFOReviewPrompt(client,state.activeQuarter,{openItems:ws.openItems,notes:ws.monthNotes});
    files=buildCFOReviewFiles(client,state.activeQuarter);
    title=`${client.name} - Q${state.activeQuarter.quarter} ${state.activeQuarter.year} Quarter-End CFO Review`;
  }else if(ws.closeType==='pfqr'){
    prompt=generatePFQRPrompt(client,state.activeQuarter,{openItems:ws.openItems,notes:ws.monthNotes});
    files=buildPFQRFiles(client,state.activeQuarter);
    title=`${client.name} - Q${state.activeQuarter.quarter} ${state.activeQuarter.year} Quarterly Profit First Analysis`;
  }else{
    const settings={basis:ws.basis,priorRevenue:ws.priorRevenue,priorNI:ws.priorNI,monthNotes:ws.monthNotes,openItems:ws.openItems,isYearEnd:ws.isYearEnd};
    prompt=generateMonthlyPrompt(client,state.activePeriod,settings);
    files=buildMonthlyFiles(client,state.activePeriod,settings);
    title=`${client.name} - ${state.activePeriod.month} ${state.activePeriod.year} Monthly Close`;
  }
  if(ws.status==='Not Started'){
    ws.status='In Progress';
  }
  saveCurrentForm(true);
  showPromptModal(prompt,files,title);
}

/* ============================================================
   MODALS
   ============================================================ */
function openModal(title,bodyHtml,size){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=bodyHtml;
  document.getElementById('modalBox').className='modal'+(size?' '+size:'');
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function showPromptModal(prompt,files,title){
  const ftLabel={xlsx:'XLSX',docx:'DOCX',proj:'Project File'};
  const html=`
    <div class="prompt-bar">
      <div class="prompt-bar-meta">Attach the files listed below to a new Claude chat in this client's project, then paste the prompt.</div>
      <button id="copyBtn" class="btn btn-primary compact" onclick="copyPrompt()">📋 Copy Prompt</button>
    </div>
    <div id="promptOutput" class="prompt-output">${escapeHtml(prompt)}</div>
    <div class="file-list">
      <div class="file-list-title">Files to Attach in Claude</div>
      ${files.map((f,i)=>`<div class="file-item"><div class="file-num">${i+1}</div><div class="file-name">${escapeHtml(f.name)}</div><span class="file-type ft-${f.type}">${ftLabel[f.type]}</span></div>`).join('')}
    </div>
  `;
  openModal(title,html,'xl');
  window._currentPrompt=prompt;
}

function copyPrompt(){
  const txt=window._currentPrompt;
  const btn=document.getElementById('copyBtn');
  navigator.clipboard.writeText(txt).then(()=>{
    btn.innerHTML='✓ Copied!';btn.style.background='var(--sage)';btn.style.color='var(--white)';
    setTimeout(()=>{btn.innerHTML='📋 Copy Prompt';btn.style.background='';btn.style.color=''},2000);
  }).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    btn.innerHTML='✓ Copied!';setTimeout(()=>btn.innerHTML='📋 Copy Prompt',2000);
  });
}

function openClientEditor(clientId,isNew){
  const client=isNew?null:state.clients.find(c=>c.id===clientId);
  const f=client||{id:'',code:'',name:'',tier:3,assigned:'Justine',entity:'',basis:'Cash',classes:'',isPF:false,isOnHold:false,isPersonal:false,notes:'',defaultOI:[]};
  window._editClient={...f,isNew};

  const html=`
    <div class="grid-2" style="grid-template-columns:120px 1fr">
      <div><label class="field-label">Code (Abbr)</label><input type="text" id="ec_code" value="${escapeHtml(f.code)}" placeholder="EOE"></div>
      <div><label class="field-label">Client Name</label><input type="text" id="ec_name" value="${escapeHtml(f.name)}" placeholder="Elite Ops Exterminators"></div>
    </div>
    <div class="grid-3">
      <div><label class="field-label">Service Tier</label>
        <select id="ec_tier">
          <option value="1"${String(f.tier)==='1'?' selected':''}>Tier 1 - CFO Advisory</option>
          <option value="2"${String(f.tier)==='2'?' selected':''}>Tier 2 - BK + PF</option>
          <option value="3"${String(f.tier)==='3'?' selected':''}>Tier 3 - BK Only</option>
          <option value="4"${String(f.tier)==='4'?' selected':''}>Tier 4 - Annual Review</option>
          <option value="P"${String(f.tier)==='P'?' selected':''}>Personal CFO</option>
        </select>
      </div>
      <div><label class="field-label">Assigned Team</label>
        <select id="ec_assigned">${TEAM_MEMBERS.map(t=>`<option value="${t}"${f.assigned===t?' selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div><label class="field-label">Basis</label>
        <select id="ec_basis"><option value="Cash"${f.basis==='Cash'?' selected':''}>Cash</option><option value="Accrual"${f.basis==='Accrual'?' selected':''}>Accrual</option></select>
      </div>
    </div>
    <div class="grid-2">
      <div><label class="field-label">Entity Type</label><input type="text" id="ec_entity" value="${escapeHtml(f.entity)}" placeholder="LLC, S-Corporation, etc."></div>
      <div><label class="field-label">Class Structure (comma-separated)</label><input type="text" id="ec_classes" value="${escapeHtml(f.classes)}" placeholder="Joint, Kelly, Randy (or blank)"></div>
    </div>
    <div class="check-row">
      <label class="check-label"><input type="checkbox" id="ec_isPF" ${f.isPF?'checked':''}> Profit First client</label>
      <label class="check-label"><input type="checkbox" id="ec_isPersonal" ${f.isPersonal?'checked':''}> Personal CFO (private)</label>
      <label class="check-label"><input type="checkbox" id="ec_isOnHold" ${f.isOnHold?'checked':''}> On hold (skip in counts)</label>
    </div>
    <div>
      <label class="field-label">Client Notes (full context for prompts)</label>
      <textarea id="ec_notes" style="min-height:130px" placeholder="Revenue patterns, recurring vendors, audit flags, behavioral notes, etc.">${escapeHtml(f.notes)}</textarea>
    </div>
    <div style="margin-top:14px">
      ${sectionLabel('','Default Open Items (pre-loaded each period)')}
      <div class="oi-table">
        <div class="oi-row head"><span>Description</span><span>Amount</span><span>Priority</span><span></span></div>
        <div id="ecOiList">${(f.defaultOI||[]).map((it,i)=>oiRowHtmlEditor(it,i)).join('')||'<div class="oi-empty">No default open items.</div>'}</div>
      </div>
      <button class="oi-add" onclick="addEditorOI()">+ Add open item</button>
    </div>
    <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div>${!isNew?`<button class="btn btn-danger" onclick="deleteClient()">🗑 Remove from Hub</button>`:''}</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveClient()">💾 ${isNew?'Add Client':'Save Changes'}</button>
      </div>
    </div>
  `;
  openModal(isNew?'Add New Client':`Edit Client: ${f.name}`,html,'lg');
}

function oiRowHtmlEditor(it,i){
  return `<div class="oi-row" data-idx="${i}">
    <input type="text" value="${escapeHtml(it.desc||'')}" placeholder="Description" onchange="window._editClient.defaultOI[${i}].desc=this.value">
    <input type="text" value="${escapeHtml(it.amt||'')}" placeholder="$0.00" onchange="window._editClient.defaultOI[${i}].amt=this.value">
    <select class="pri-${it.pri||'MEDIUM'}" onchange="window._editClient.defaultOI[${i}].pri=this.value;this.className='pri-'+this.value">${PRIORITY_OPTIONS.map(p=>`<option value="${p}"${(it.pri||'MEDIUM')===p?' selected':''}>${p}</option>`).join('')}</select>
    <button class="oi-rm" onclick="removeEditorOI(${i})">✕</button>
  </div>`;
}
function addEditorOI(){
  if(!window._editClient.defaultOI)window._editClient.defaultOI=[];
  window._editClient.defaultOI.push({desc:'',amt:'',pri:'MEDIUM'});
  document.getElementById('ecOiList').innerHTML=window._editClient.defaultOI.map((it,i)=>oiRowHtmlEditor(it,i)).join('');
}
function removeEditorOI(idx){
  window._editClient.defaultOI.splice(idx,1);
  document.getElementById('ecOiList').innerHTML=window._editClient.defaultOI.length?window._editClient.defaultOI.map((it,i)=>oiRowHtmlEditor(it,i)).join(''):'<div class="oi-empty">No default open items.</div>';
}

function saveClient(){
  const e=window._editClient;
  e.code=document.getElementById('ec_code').value.trim().toUpperCase();
  e.name=document.getElementById('ec_name').value.trim();
  if(!e.code||!e.name){alert('Code and name are required.');return}
  const tierVal=document.getElementById('ec_tier').value;
  e.tier=tierVal==='P'?'P':Number(tierVal);
  e.assigned=document.getElementById('ec_assigned').value;
  e.basis=document.getElementById('ec_basis').value;
  e.entity=document.getElementById('ec_entity').value;
  e.classes=document.getElementById('ec_classes').value;
  e.isPF=document.getElementById('ec_isPF').checked;
  e.isPersonal=document.getElementById('ec_isPersonal').checked;
  e.isOnHold=document.getElementById('ec_isOnHold').checked;
  e.notes=document.getElementById('ec_notes').value;

  if(e.isNew){
    e.id=e.code.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now().toString(36);
    delete e.isNew;
    state.clients.push(e);
  }else{
    const idx=state.clients.findIndex(c=>c.id===e.id);
    if(idx>=0){delete e.isNew;state.clients[idx]=e}
  }
  saveClients();
  closeModal();
  flashSaved();
  render();
}

function deleteClient(){
  const e=window._editClient;
  if(!confirm(`Remove ${e.name} from the hub? Close history will remain in storage but the client will not appear on the dashboard.`))return;
  state.clients=state.clients.filter(c=>c.id!==e.id);
  saveClients();
  closeModal();
  flashSaved();
  render();
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  const stored=loadClients();
  if(stored&&Array.isArray(stored)&&stored.length>0){
    state.clients=stored;
  }else{
    state.clients=DEFAULT_CLIENTS.slice();
    saveClients();
  }
  state.closes=loadAllCloses();
  render();
}

window.addEventListener('DOMContentLoaded',init);
</script>
